[package]
name = "cli"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/qter-project/qter"
authors = [ "Arhan Chaudhary", "Henry Rovnyak" ]

[dependencies]
clap = { version = "4.6", features = [ "derive" ] }
color-eyre = "0.6"
itertools.workspace = true
owo-colors = "4.4.0"
qter_core.workspace = true
compiler.workspace = true
interpreter.workspace = true
ariadne.workspace = true
log.workspace = true
sarlacc.workspace = true
puzzle_theory.workspace = true
chumsky.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
crashlog = "0.1.5"

[lints]
workspace = true

[[bin]]
name = "qter"
path = "src/main.rs"
