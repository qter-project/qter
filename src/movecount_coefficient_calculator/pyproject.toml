[project]
name = "movecount-coefficient-calculator"
version = "0.1.0"
description = "Neural network to estimate the difficulty of performing a move sequence"
authors = [
    {name = "Henry Rovnyak",email = "h.rovnyak@proton.me"}
]
requires-python = ">=3.14"
dependencies = [
    "altair (>=6.3.0,<7.0.0)",
    "torch (>=2.14.1,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "polars (>=2.0.0,<3.0.0)",
    "vl-convert-python (>=1.9.0.post1,<2.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
